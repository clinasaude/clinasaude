name: CLINA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: clina-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
